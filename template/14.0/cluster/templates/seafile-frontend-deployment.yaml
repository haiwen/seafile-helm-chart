{{- $dataClaim := include "seafile.seafileDataVolume.claimName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seafile-frontend
spec:
  replicas: {{ include "seafile.cluster.frontendNums" . }}
  selector:
    matchLabels:
      app: seafile-frontend
  template:
    metadata:
      labels:
        app: seafile-frontend
      {{- with .Values.seafile.podAnnotations.frontend }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      enableServiceLinks: false
      {{- with .Values.seafile.podSecurityContext.frontend }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if include "seafile.seafileDataVolume.managed" . | eq "true" }}
      initContainers:  
        - name: set-ownership  
          image: busybox  
          command: ['sh', '-c', 'chown -R root:root /shared']  
          {{- with .Values.seafile.initContainerSecurityContext.frontend }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:  
          - name: seafile-data  
            mountPath: /shared
      {{- end }}
      containers:
        - name: seafile-frontend
          image: {{ include "seafile.image" . }}
          {{- with .Values.seafile.securityContext.frontend }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: CLUSTER_INIT_MODE
              value: {{ .Values.seafile.initMode | quote}}
            - name: CLUSTER_SERVER
              value: "true"
            - name: CLUSTER_MODE
              value: "frontend"
            - name: SEAFILE_AI_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.seafile.existingSecret.name }}
                  key: JWT_PRIVATE_KEY
          envFrom:
            - configMapRef:
                name: seafile-env
            - secretRef:
                name: {{ .Values.seafile.existingSecret.name }}

            {{- /* extra envs */ -}}
            {{- if .Values.seafile.extraEnv.frontend }}
              {{- toYaml .Values.seafile.extraEnv.frontend | nindent 12 }}
            {{- end }}
          ports:
            - containerPort: 80
          {{- if $dataClaim }}
          volumeMounts:
            - name: seafile-data
              mountPath: /shared
            {{- range .Values.seafile.extraVolumes.frontend }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
              {{- if .subPath }}
              subPath: {{ .subPath }}
              {{- end }}
              {{- if .readOnly }}
              readOnly: {{ .readOnly }}
              {{- end }}
            {{- end }}
          {{- end }}
          resources: {{- toYaml .Values.seafile.extraResources.frontend | nindent 12 }}
      {{- if $dataClaim }}
      volumes:
        - name: seafile-data
          persistentVolumeClaim:
            claimName: {{ $dataClaim | quote }}
        {{- range .Values.seafile.extraVolumes.frontend }}
        - name: {{ .name }}
          {{- toYaml .volumeInfo | nindent 10 }}
        {{- end }}
      {{- end }}
      restartPolicy: Always
      imagePullSecrets:
        - name: regcred
